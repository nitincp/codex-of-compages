[project]
name = "faber"
version = "0.1.0"
description = "Faber — prompt engineering project for adaptive formal specification using layered agent compositions"
requires-python = ">=3.10"
dependencies = [
    # LLM
    "anthropic>=0.30.0",
    # Agent orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    # Graph store
    "kuzu>=0.5.0",
    # UI
    "chainlit>=1.1.0",
    "streamlit>=1.35.0",
    # Utilities
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.10"
include = ["src"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: live API call (requires ANTHROPIC_API_KEY)",
]
